name: Sync photos from Google Drive

on:
  schedule:
    - cron: '17 8 * * *' # daily, around 3am Central
  workflow_dispatch: # "Run workflow" button for an immediate sync

permissions:
  contents: write
  pages: write

concurrency: sync-photos

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-photos.txt

      - run: pip install -r scripts/requirements-photos.txt

      - name: Sync photos
        run: python scripts/sync_photos.py
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}

      - name: Commit changes
        id: commit
        run: |
          git add photos
          if git diff --cached --quiet; then
            echo "No photo changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(photos): sync from Google Drive"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made by this workflow's token may not start a Pages build on their own
      - name: Rebuild the site
        if: steps.commit.outputs.pushed == 'true'
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
